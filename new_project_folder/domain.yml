responses:
  utter_ask_maize_1:
  - text: "Maize grows best in deep, well-drained loamy soils with moderate organic matter and a slightly acidic to neutral pH. Such soils allow good root development and nutrient uptake."

  utter_ask_maize_2:
  - text: "Poor drainage causes waterlogging, which reduces oxygen in the soil and leads to root rot, nutrient loss, and poor maize growth."

  utter_ask_maize_3:
  - text: "Early planting helps maize establish before heavy rains and reduces exposure to drought stress and late-season pests."

  utter_ask_maize_4:
  - text: "Late planting exposes maize to moisture stress, higher pest pressure, and poor grain filling before harvest."

  utter_ask_maize_5:
  - text: "Nitrogen promotes leaf development, chlorophyll formation, and overall vegetative growth needed for high yields."

  utter_ask_maize_6:
  - text: "Nitrogen deficiency causes older maize leaves to turn pale green or yellow, starting from the tip and moving down the midrib."

  utter_ask_maize_7:
  - text: "Phosphorus supports root development, early plant vigor, and energy transfer needed for flowering and grain formation."

  utter_ask_maize_8:
  - text: "Potassium deficiency weakens stalks, reduces drought tolerance, and leads to poor grain filling."

  utter_ask_maize_9:
  - text: "Maize is most sensitive to water stress during tasseling, silking, and early grain filling stages."

  utter_ask_maize_10:
  - text: "Drought at flowering reduces pollination success, leading to poor cob formation and yield loss."

  utter_ask_maize_11:
  - text: "Weeds compete with maize for nutrients, water, and sunlight, especially in the first six weeks after planting."

  utter_ask_maize_12:
  - text: "Uncontrolled weeds reduce plant vigor, increase pest habitats, and significantly lower grain yield."

  utter_ask_maize_13:
  - text: "Fall armyworm is a major pest that feeds on maize leaves, especially at the seedling and vegetative stages."

  utter_ask_maize_14:
  - text: "Fall armyworm causes irregular holes, ragged leaves, and presence of frass inside the whorl."

  utter_ask_maize_15:
  - text: "Early detection allows timely control before larvae grow large and cause severe damage."

  utter_ask_maize_16:
  - text: "Early planting can help maize escape peak fall armyworm populations that occur later in the season."

  utter_ask_maize_17:
  - text: "Crop rotation, timely planting, field sanitation, and destruction of infested residues reduce pest buildup."

  utter_ask_maize_18:
  - text: "Fall armyworm causes holes and frass, while nutrient deficiency causes uniform color changes without chewing marks."

  utter_ask_maize_19:
  - text: "Parasitic wasps, birds, and predatory insects naturally reduce maize pest populations."

  utter_ask_maize_20:
  - text: "IPM combines cultural, biological, and chemical methods to control pests sustainably and reduce resistance."

  utter_ask_maize_21:
  - text: "Correct spacing reduces competition for nutrients and sunlight, allowing each maize plant to form fuller cobs and improve overall yield."

  utter_ask_maize_22:
  - text: "Overcrowding causes weak stems, poor air circulation, increased disease pressure, and smaller cobs."

  utter_ask_maize_23:
  - text: "Thinning removes excess seedlings to maintain optimal plant population and reduce competition."

  utter_ask_maize_24:
  - text: "Improved varieties are bred for higher yield, disease tolerance, and better adaptation to local conditions."

  utter_ask_maize_25:
  - text: "Drought-tolerant varieties maintain growth and yield under low rainfall conditions common in northern regions."

  utter_ask_maize_26:
  - text: "Split application reduces nutrient loss and ensures nutrients are available during critical growth stages."

  utter_ask_maize_27:
  - text: "Too much nitrogen causes excessive leaf growth, weak stalks, delayed maturity, and lodging."

  utter_ask_maize_28:
  - text: "Soil testing identifies nutrient deficiencies and prevents over- or under-fertilization."

  utter_ask_maize_29:
  - text: "Delayed weeding allows weeds to absorb nutrients first, leaving maize nutrient-deficient."

  utter_ask_maize_30:
  - text: "Young maize plants have shallow roots, making them vulnerable to competition from fast-growing weeds."

  utter_ask_maize_31:
  - text: "Maize stem borers tunnel into stems, weakening plants and causing them to fall."

  utter_ask_maize_32:
  - text: "Signs include dead hearts, holes on stems, frass, and broken stalks."

  utter_ask_maize_33:
  - text: "They are protected within the stem, making contact insecticides less effective."

  utter_ask_maize_34:
  - text: "Timely planting allows maize to mature before peak stem borer populations develop."

  utter_ask_maize_35:
  - text: "Removing crop residues eliminates breeding sites and reduces future infestations."

  utter_ask_maize_36:
  - text: "Rotation breaks pest life cycles by removing their preferred host plants."

  utter_ask_maize_37:
  - text: "Northern corn leaf blight is a common fungal disease that creates elongated leaf lesions."

  utter_ask_maize_38:
  - text: "High humidity creates favorable conditions for fungal spores to germinate and spread."

  utter_ask_maize_39:
  - text: "Resistant varieties reduce disease severity and minimize yield loss without heavy chemical use."

  utter_ask_maize_40:
  - text: "Maize is ready when cobs are firm, husks dry, and grains are hard and shiny."

  utter_ask_maize_41:
  - text: "Early harvesting leads to high moisture content, poor grain quality, and storage problems."

  utter_ask_maize_42:
  - text: "Delayed harvesting increases risk of pest attack, mold growth, and grain shattering."

  utter_ask_maize_43:
  - text: "Drying reduces moisture content, preventing mold growth and insect infestation."

  utter_ask_maize_44:
  - text: "Poor storage encourages insects, rodents, and moisture buildup that damage grains."

  utter_ask_maize_45:
  - text: "Hermetic storage limits oxygen, suppressing insects and preserving grain quality."

  utter_ask_maize_46:
  - text: "Unpredictable rainfall influences planting dates, variety choice, and crop survival."

  utter_ask_maize_47:
  - text: "Short-duration varieties mature quickly and reduce exposure to drought or flooding."

  utter_ask_maize_48:
  - text: "Extension services provide training, improved seeds, and best management practices."

  utter_ask_maize_49:
  - text: "Educated farmers can identify pests early and apply correct control methods."

  utter_ask_maize_50:
  - text: "Records help farmers track inputs, yields, and challenges to make better decisions."

  utter_ask_maize_51:
  - text: "Compacted soil restricts root penetration, reduces water infiltration, and limits nutrient uptake, leading to weak maize growth."

  utter_ask_maize_52:
  - text: "Organic matter improves soil structure, water retention, microbial activity, and long-term fertility."

  utter_ask_maize_53:
  - text: "Seeds planted too deep emerge slowly, while shallow planting exposes seeds to drying and bird damage."

  utter_ask_maize_54:
  - text: "Uniform depth ensures even emergence, synchronized growth, and efficient fertilizer use."

  utter_ask_maize_55:
  - text: "Zinc deficiency causes stunted growth, shortened internodes, and pale bands on young leaves."

  utter_ask_maize_56:
  - text: "Micronutrients support enzyme activity and metabolic processes essential for healthy maize growth."

  utter_ask_maize_57:
  - text: "Excess water causes leaching of nutrients beyond the root zone, reducing fertilizer efficiency."

  utter_ask_maize_58:
  - text: "Irrigation supplies consistent moisture, supporting growth during critical stages when rainfall is absent."

  utter_ask_maize_59:
  - text: "A large weed seed bank increases weed pressure in subsequent seasons, raising control costs."

  utter_ask_maize_60:
  - text: "Combining manual, cultural, and chemical methods reduces resistance and long-term weed dominance."

  utter_ask_maize_61:
  - text: "Maize weevils are common storage pests that bore into grains and reduce quality."

  utter_ask_maize_62:
  - text: "Proper drying, airtight storage, and regular cleaning of stores reduce weevil infestation."

  utter_ask_maize_63:
  - text: "High moisture favors pest survival and rapid reproduction in stored maize."

  utter_ask_maize_64:
  - text: "Rodents consume grains, contaminate stores, and create entry points for insects."

  utter_ask_maize_65:
  - text: "Clean fields remove pest shelters and reduce survival between seasons."

  utter_ask_maize_66:
  - text: "It reduces leaf photosynthesis, stunts growth, and lowers grain yield."

  utter_ask_maize_67:
  - text: "Early planting avoids peak populations of leafhopper vectors that spread the disease."

  utter_ask_maize_68:
  - text: "At maturity, grains have maximum dry matter and better storage stability."

  utter_ask_maize_69:
  - text: "High moisture and mold growth allow aflatoxin-producing fungi to develop."

  utter_ask_maize_70:
  - text: "Damaged grains attract pests and spread mold to healthy grains."

  utter_ask_maize_71:
  - text: "Excess rainfall causes waterlogging, root suffocation, and nutrient loss."

  utter_ask_maize_72:
  - text: "It helps farmers adapt to climate risks while maintaining productivity and soil health."

  utter_ask_maize_73:
  - text: "It improves seedbed quality, saves labor, and ensures timely planting."

  utter_ask_maize_74:
  - text: "Improper machinery can compact soil and increase production costs without yield benefit."

  utter_ask_maize_75:
  - text: "Hybrid grain loses vigor and yield potential when replanted."

  utter_ask_maize_76:
  - text: "High-quality seeds germinate uniformly and produce strong, healthy seedlings."

  utter_ask_maize_77:
  - text: "Continuous maize provides constant food for pests, allowing populations to build up."

  utter_ask_maize_78:
  - text: "Intercropping disrupts pest movement and attracts natural enemies."

